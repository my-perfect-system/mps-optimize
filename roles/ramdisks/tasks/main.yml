---
- name: "OPTIMIZE_RAMDISKS - Check current mount state of ramdisks_mount"
  ansible.builtin.command: findmnt -n -o FSTYPE {{ ramdisks_mount }}
  register: ramdisks_fstype
  changed_when: false
  failed_when: false

- name: "OPTIMIZE_RAMDISKS - Set tmpfs flag"
  ansible.builtin.set_fact:
    ramdisks_is_tmpfs: "{{ ramdisks_fstype.stdout == 'tmpfs' }}"

- name: "OPTIMIZE_RAMDISKS - Convert ramdisks_mount to tmpfs with backup/restore"
  become: true
  when: not ramdisks_is_tmpfs | bool
  block:
    - name: "OPTIMIZE_RAMDISKS - Ensure backup dir exists"
      ansible.builtin.file:
        path: "{{ ramdisks_backup_path }}"
        state: directory
        mode: "0700"

    - name: "OPTIMIZE_RAMDISKS - Check if backup marker exists"
      ansible.builtin.stat:
        path: "{{ ramdisks_backup_marker }}"
      register: ramdisks_backup_done

    - name: "OPTIMIZE_RAMDISKS - Backup ramdisks_mount contents"
      ansible.builtin.copy:
        src: "{{ ramdisks_mount }}/"
        dest: "{{ ramdisks_backup_path }}/"
        remote_src: true
        mode: preserve
      when: not ramdisks_backup_done.stat.exists

    - name: "OPTIMIZE_RAMDISKS - Mark backup as done"
      ansible.builtin.file:
        path: "{{ ramdisks_backup_marker }}"
        state: touch
        mode: "0644"
      when: not ramdisks_backup_done.stat.exists

    - name: "OPTIMIZE_RAMDISKS - Unmount ramdisks_mount if mounted"
      ansible.posix.mount:
        path: "{{ ramdisks_mount }}"
        state: unmounted

    - name: "OPTIMIZE_RAMDISKS - Ensure tmpfs entry in fstab"
      ansible.builtin.blockinfile:
        path: /etc/fstab
        marker: "{{ ramdisks_fstab_marker }}"
        block: |
          # Mount ramdisks_mount as tmpfs (volatile)
          tmpfs {{ ramdisks_mount }} tmpfs {{ ramdisks_opts }} 0 0

    - name: "OPTIMIZE_RAMDISKS - Recreate ramdisks_mount directory"
      ansible.builtin.file:
        path: "{{ ramdisks_mount }}"
        state: directory
        owner: root
        group: root
        mode: "1777"

    - name: "OPTIMIZE_RAMDISKS - Mount tmpfs at ramdisks_mount"
      ansible.posix.mount:
        path: "{{ ramdisks_mount }}"
        src: tmpfs
        fstype: tmpfs
        opts: "{{ ramdisks_opts }}"
        state: mounted

    - name: "OPTIMIZE_RAMDISKS - Restore backed-up contents"
      ansible.builtin.copy:
        src: "{{ ramdisks_backup_path }}/"
        dest: "{{ ramdisks_mount }}/"
        remote_src: true
        mode: preserve

    - name: "OPTIMIZE_RAMDISKS - Ensure correct ownership of restored contents"
      ansible.builtin.file:
        path: "{{ ramdisks_mount }}"
        state: directory
        recurse: true
        owner: root
        group: root

    - name: "OPTIMIZE_RAMDISKS - Restart systemd-journald"
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
