---
- name: Convert ramdisks mount to tmpfs when needed
  become: true
  when: not ramdisks_is_tmpfs | bool
  block:
    - name: Ensure backup dir exists
      ansible.builtin.file:
        path: "{{ ramdisks_backup_path }}"
        state: directory
        mode: "0700"

    - name: Check if backup marker exists
      ansible.builtin.stat:
        path: "{{ ramdisks_backup_marker }}"
      register: ramdisks_backup_done

    - name: Backup ramdisks_mount contents
      ansible.builtin.copy:
        src: "{{ ramdisks_mount }}/"
        dest: "{{ ramdisks_backup_path }}/"
        remote_src: true
        mode: preserve
      when: not ramdisks_backup_done.stat.exists

    - name: Mark backup as done
      ansible.builtin.file:
        path: "{{ ramdisks_backup_marker }}"
        state: touch
        mode: "0644"
      when: not ramdisks_backup_done.stat.exists

    - name: Unmount ramdisks_mount if mounted
      ansible.posix.mount:
        path: "{{ ramdisks_mount }}"
        state: unmounted

    - name: Ensure tmpfs entry in fstab
      ansible.builtin.blockinfile:
        path: /etc/fstab
        marker: "{{ ramdisks_fstab_marker }}"
        block: |
          # Mount ramdisks_mount as tmpfs (volatile)
          tmpfs {{ ramdisks_mount }} tmpfs {{ ramdisks_opts }} 0 0

    - name: Recreate ramdisks_mount directory
      ansible.builtin.file:
        path: "{{ ramdisks_mount }}"
        state: directory
        owner: root
        group: root
        mode: "1777"

    - name: Mount tmpfs at ramdisks_mount
      ansible.posix.mount:
        path: "{{ ramdisks_mount }}"
        src: tmpfs
        fstype: tmpfs
        opts: "{{ ramdisks_opts }}"
        state: mounted

    - name: Restore backed-up contents
      ansible.builtin.copy:
        src: "{{ ramdisks_backup_path }}/"
        dest: "{{ ramdisks_mount }}/"
        remote_src: true
        mode: preserve

    - name: Ensure correct ownership of restored contents
      ansible.builtin.file:
        path: "{{ ramdisks_mount }}"
        state: directory
        recurse: true
        owner: root
        group: root

    - name: Restart systemd-journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
